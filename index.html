<!doctype html>
<html lang="en">
  <head>

    <title>Glass-Box Sampler — how a language model picks each token</title>
    <meta
      name="description"
      content="An interactive view of LLM token sampling: the top-10 candidate distribution behind every token, and what temperature and top-p do to it."

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <script type="module" crossorigin src="./assets/index-fx6jVCs3.js"></script>

  <body>
    <!--
      The shell is deliberately thin. The header below paints before any module
      evaluates, which gives the largest contentful paint something real to land
      on, and the skeleton is sized so the app replacing it shifts nothing.

      IT MUST MATCH THE HEADER BUILT IN src/ui/app.ts -- same elements, same
      classes, same text. The strings come from src/ui/copy.ts there; here they
      are literals, so a copy change has to land in both files.
    -->
    <main id="app">
      <header class="app-header">
        <div class="app-brand">
          <span class="app-logo">
            <svg
              viewBox="0 0 32 32"
              width="26"
              height="26"
              fill="none"
              stroke="currentColor"
              stroke-width="1.35"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M16 3 27.3 9.5 27.3 22.5 16 29 4.7 22.5 4.7 9.5Z" />
              <path d="M16 16 16 3M16 16 27.3 22.5M16 16 4.7 22.5" stroke-opacity="0.55" />
            </svg>
          </span>
          <div>
            <h1 class="app-title">Glass-Box Sampler</h1>
            <p class="app-subtitle">
              See the candidate distribution behind every token a language model writes.
            </p>
          </div>
        </div>
        <button class="about-button" type="button">
          <svg
            viewBox="0 0 16 16"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.25"
            stroke-linecap="round"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="8" cy="8" r="6.25" />
            <path d="M8 7.25v4" />
            <path d="M8 4.75v.5" />
